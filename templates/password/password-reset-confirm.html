
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parolni tiklash</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #0a1128;
    background: linear-gradient(160deg, #0a1128 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .login-box {
    background-color: #111c3f;
    border: 1px solid #223163;
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    position: relative;
  }

  .back-button {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.1);
    color: #e8ecf7;
    text-decoration: none;
    transition: background-color 0.2s ease, transform 0.2s ease;
    cursor: pointer;
  }

  .back-button:hover {
    background-color: rgba(255, 255, 255, 0.15);
    transform: scale(1.05);
    text-decoration: none;
  }

  .back-button:active {
    transform: scale(0.95);
  }

  .back-button .material-icons {
    font-size: 22px;
  }

  h1 {
    color: #e8ecf7;
    font-size: 22px;
    margin: 0 0 6px;
    text-align: center;
  }

  p.subtitle {
    color: #7c88b8;
    font-size: 14px;
    margin: 0 0 28px;
    text-align: center;
  }

  label {
    display: block;
    color: #a9b4d6;
    font-size: 13px;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 18px;
    background-color: #0c1533;
    border: 1px solid #29366b;
    border-radius: 6px;
    color: #e8ecf7;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input:focus {
    border-color: #3b82f6;
  }

  input::placeholder {
    color: #55608c;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    background-color: #2563eb;
    border: none;
    border-radius: 6px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  button:hover {
    background-color: #1d4ed8;
  }

  .options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: -8px 0 18px;
    font-size: 13px;
    color: #7c88b8;
  }

  a {
    color: #6ea8fe;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <div class="login-box">



    <a href="/login/" class="back-button" title="Orqaga qaytish">
      <span class="material-icons" style="font-size: 24px;">chevron_left</span>
    </a>

    {% if validlink %}
      <form method="post" action="">
        {% csrf_token %}

        <h1>Parolni tiklash</h1>
        <p class="subtitle">Ko'rsatilgan E-mail manzilga parolni tiklash bo'yicha yo'riqnoma yuboriladi</p>

        <label for="new_password1">Yangi parol:</label>
        <input type="password" id="new_password1" name="new_password1"  required>
        
        <label for="new_password2">Parolni tasdiqlash:</label>
        <input type="password" id="new_password2" name="new_password2"  required>

        <button type="submit">Yuborish</button>
      </form>
    {% else %}
      <p style="color: white; text-align: center; font-weight: 600; font-size: 28px;">Havola ishlatilgan yoki noto'g'ri</p>
    {% endif %}
  </div>

</body>
</html>
