<nav class="navbar">
    <span class="navbar__brand"><i>✓</i> Todo</span>

    <div class="navbar__links">
        {% if request.user.is_authenticated %}
            <a href="/new-todo/" class="btn btn--primary">+ TODO</a>
            <a href="/" class="btn btn--ghost">Bosh sahifa</a>
            <a href="/logout/" class="btn btn--ghost">Chiqish</a>
            {% else %}
            <a href="/" class="btn btn--ghost">Bosh sahifa</a>
            <a href="/login/" class="btn btn--primary">Kirish</a>
        {% endif %}
    </div>
</nav>

<style>
    :root {
        --bg: #0b1120;
        --surface: #111827;
        --surface-hover: #1a2333;
        --accent: #14b8a6;
        --accent-hover: #2dd4bf;
        --accent-tint: rgba(20, 184, 166, 0.12);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --border: #1f2937;
    }

    body {
        background: var(--bg);
    }

    .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .navbar__brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        font-size: 16px;
        color: var(--text-primary);
    }

    .navbar__brand i {
        font-style: normal;
        color: var(--accent);
    }

    .navbar__links {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn {
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 8px;
        transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }

    .btn--primary {
        background: var(--accent);
        color: #04120f;
    }

    .btn--primary:hover {
        background: var(--accent-hover);
    }

    .btn--ghost {
        color: var(--text-secondary);
        background: transparent;
    }

    .btn--ghost:hover {
        background: var(--surface-hover);
        color: var(--text-primary);
    }

    .btn:active {
        transform: scale(0.97);
    }
</style>
